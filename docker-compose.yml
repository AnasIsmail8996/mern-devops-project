
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  backend1:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      API_NEW: api
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/mern-todos
    expose:
      - "5000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  backend2:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      API_NEW: api2
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/mern-todos
    expose:
      - "5000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  backend3:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      API_NEW: api3
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/mern-todos
    expose:
      - "5000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/cache:/data/nginx/cache
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo_data:
