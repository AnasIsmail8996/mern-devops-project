 name: MERN PROJECT CI/CD 

  on:
    push: 
      branches: [ main ]
    pull_request:
      branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        
         - name: Docker Compose validation

         run: |
          printf '\n' > backend/.env
          docker compose -p mern-practice config --quiet

          
      - name: Build Docker images
        run: |
          docker compose -p mern-practice build

      - name: Check build result
        run: echo "MERN Docker build successful"
              